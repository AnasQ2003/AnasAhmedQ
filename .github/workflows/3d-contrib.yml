name: 3D Contribution Calendar

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-3d-profile-contribution
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: AnasQ2003
          MAX_REPOS: 10

      - name: Commit & Push 3D SVG
        run: |
          git config user.email "anasahmedcp@gmail.com"
          git config user.name "AnasQ2003"
          git add -A .
          git commit -m "generate 3D contribution calendar [skip ci]" || echo "Nothing to commit"
          git push
